name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: node benchmarks/reliability.mjs
      - run: node examples/agent-recovery.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: reliability-${{ runner.os }}
          path: artifacts/reliability/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-demo-${{ runner.os }}
          path: artifacts/demo/transcript.json
          if-no-files-found: error

  compare-reliability:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: reliability-*
          path: artifacts/reliability
          merge-multiple: true
      - run: node benchmarks/compare-reliability.mjs artifacts/reliability

  package-sizes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-package-sizes.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: package-sizes
          path: artifacts/package-sizes/report.json
          if-no-files-found: error
      - name: Report sizes on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/package-sizes/report.json', 'utf8'));
            const format = (b) => b < 1024 ? `${b} B` : `${(b / 1024).toFixed(1)} KB`;
            const lines = report.packages.map(p =>
              `| ${p.name} | ${format(p.packedBytes)} | ${format(p.limit)} | ${p.fileCount} | ${p.withinLimit ? '✓' : '✗ OVER'} |`
            );
            const body = [
              '### Package Size Report',
              '',
              '| Package | Packed | Limit | Files | Status |',
              '|---------|--------|-------|-------|--------|',
              ...lines,
              '',
              `**Total:** ${format(report.summary.totalPackedBytes)} across ${report.packages.length} packages`,
              '',
              report.summary.overLimit > 0
                ? `⚠️ **${report.summary.overLimit} package(s) exceed their size limit.**`
                : 'All packages are within their size limits.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Package Size Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
